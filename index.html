<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMODA // SECURE NEON CONTROL</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --neon-yellow: #f39c12;
            --text-main: #e2e8f0;
            --border-glow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, #1a1f35 0%, var(--bg-color) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 25px;
            border-radius: 16px;
            box-shadow: var(--border-glow);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        h2, h3 {
            margin-top: 0;
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
            letter-spacing: 1px;
        }

        /* Màn hình đăng nhập */
        #login-screen {
            display: block;
        }

        /* Màn hình điều khiển chính (ẩn đi lúc đầu) */
        #main-app {
            display: none;
            width: 100%;
            max-width: 380px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--neon-cyan);
            font-size: 0.85rem;
        }

        .status-item span {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .btn {
            border: none;
            color: #fff;
            padding: 12px;
            font-size: 0.9rem;
            margin: 6px 0;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn:active { transform: scale(0.98); }
        .btn-on { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .btn-off { background: linear-gradient(135deg, #cb2d3e, #ef473a); }
        .btn-pc { background: linear-gradient(135deg, #2193b0, #6dd5ed); color: #000; }
        .btn-scan { background: linear-gradient(135deg, #833ab4, #fd1d1d); }
        .btn-save { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-warn { background: linear-gradient(135deg, #f12711, #f5af19); }
        .btn-login { background: var(--neon-cyan); color: #0b0f19; font-size: 1rem; box-shadow: 0 0 12px rgba(0,243,255,0.4); }

        input, select {
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
            text-align: center;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        .error-msg {
            color: var(--neon-pink);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            display: none;
            text-shadow: 0 0 5px rgba(255,0,85,0.4);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 380px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .logout-link {
            color: var(--neon-pink);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP (CÓ Ô NHẬP IP VÀ MẬT KHẨU) -->
    <div class="card" id="login-screen">
        <h2>⚡ GAMODA ACCESS ⚡</h2>
        <p style="text-align:center; font-size:0.85rem; color:#94a3b8;">Nhập thông tin kết nối vào hệ thống LAN</p>
        
        <label><b>IP ESP32 trong LAN:</b></label>
        <input type="text" id="loginIp" placeholder="Ví dụ: 192.168.1.7">
        
        <label><b>Mật khẩu hệ thống:</b></label>
        <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
        
        <button class="btn btn-login" onclick="attemptLogin()">ĐĂNG NHẬP HỆ THỐNG</button>
        <div class="error-msg" id="errorMsg">❌ Sai mật khẩu hoặc không kết nối được ESP32!</div>
    </div>

    <!-- MÀN HÌNH ĐIỀU KHIỂN CHÍNH (SAO KHI ĐĂNG NHẬP ĐÚNG - KHÔNG CÒN Ô NHẬP MẬT KHẨU) -->
    <div id="main-app">
        <div class="top-bar">
            <span>🟢 Đã kết nối LAN</span>
            <span class="logout-link" onclick="logout()">Đăng xuất 🔒</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('control', this)">🎮 ĐIỀU KHIỂN</button>
            <button class="tab-btn" onclick="switchTab('radar', this)">📡 CẢM BIẾN</button>
            <button class="tab-btn" onclick="switchTab('wifi', this)">🌐 MẠNG</button>
        </div>

        <!-- TAB 1: ĐIỀU KHIỂN THIẾT BỊ -->
        <div class="tab-content active" id="tab-control">
            <div class="card">
                <h3>🖥️ TRẠNG THÁI</h3>
                <div class="status-grid">
                    <div class="status-item"><span>THỜI GIAN</span><b id="time">--:--</b></div>
                    <div class="status-item"><span>RƠ-LE</span><b id="relay">--</b></div>
                </div>
                <button class="btn btn-on" onclick="sendCmd('on')">💡 BẬT THIẾT BỊ CHÍNH</button>
                <button class="btn btn-off" onclick="sendCmd('off')">🔌 TẮT THIẾT BỊ CHÍNH</button>
                <button class="btn btn-pc" onclick="sendCmd('onpc')">🖥️ BẬT NGUỒN PC</button>
                <button class="btn btn-warn" onclick="sendCmd('offpc')">⚠️ TẮT CƯỠNG BỨC PC</button>
            </div>
        </div>

        <!-- TAB 2: CẢM BIẾN RADAR -->
        <div class="tab-content" id="tab-radar">
            <div class="card">
                <h3>📡 CẢM BIẾN LD2410B</h3>
                <div class="status-grid">
                    <div class="status-item"><span>TRẠNG THÁI</span><b id="radar_status">--</b></div>
                    <div class="status-item"><span>ĐỘ NHẠY</span><b id="current_sens">-- cm</b></div>
                </div>
                <p>🏃 Di chuyển: <b id="mov_dist" style="color:var(--neon-cyan)">--</b></p>
                <p>🧍 Đứng yên: <b id="stat_dist" style="color:var(--neon-green)">--</b></p>

                <button class="btn btn-on" onclick="sendCmd('radar_on')">📡 BẬT CẢM BIẾN RADAR</button>
                <button class="btn btn-off" onclick="sendCmd('radar_off')">🔕 TẮT CẢM BIẾN RADAR</button>
                
                <label style="margin-top:10px; display:block; font-size:0.85rem;">Khoảng cách tối đa:</label>
                <input type="number" id="radarSensVal" placeholder="50 - 1200 cm" min="50" max="1200">
                <button class="btn btn-pc" style="background:var(--neon-yellow); color:#000;" onclick="updateSensitivity()">⚙️ CẬP NHẬT ĐỘ NHẠY</button>
            </div>
        </div>

        <!-- TAB 3: QUẢN LÝ WI-FI -->
        <div class="tab-content" id="tab-wifi">
            <div class="card">
                <h3>🌐 CẤU HÌNH WI-FI</h3>
                <button class="btn btn-scan" onclick="scanWiFi()">🔍 QUÉT MẠNG WI-FI</button>
                
                <div id="scanResultArea" style="margin: 10px 0;">
                    <label style="font-size:0.85rem;">Tên Wi-Fi thủ công:</label>
                    <input type="text" id="manualSsid" placeholder="Nhập SSID mạng">
                </div>

                <label style="font-size:0.85rem;">Mật khẩu Wi-Fi mới:</label>
                <input type="password" id="newWifiPass" placeholder="Nhập password Wi-Fi">
                
                <button class="btn btn-save" onclick="changeWiFi()">🔗 LƯU & KẾT NỐI</button>
            </div>
        </div>
    </div>

    <script>
        let globalIp = localStorage.getItem('esp_ip') || '';
        let globalPass = localStorage.getItem('esp_pass') || '';

        // Tự động kiểm tra nếu trước đó đã lưu thông tin đăng nhập đúng
        if(globalIp && globalPass) {
            document.getElementById('loginIp').value = globalIp;
            document.getElementById('loginPass').value = globalPass;
            verifyAndEnter(globalIp, globalPass, true);
        }

        function attemptLogin() {
            let ip = document.getElementById('loginIp').value.trim();
            let pass = document.getElementById('loginPass').value.trim();
            
            if(!ip || !pass) {
                showError("Vui lòng nhập đầy đủ IP và mật khẩu!");
                return;
            }
            verifyAndEnter(ip, pass, false);
        }

        function verifyAndEnter(ip, pass, isAuto) {
            // Gọi thử API /data của ESP32 để kiểm tra mật khẩu có chuẩn không
            fetch(`http://${ip}/data?pass=${pass}`)
                .then(res => {
                    if(res.ok) {
                        // Đăng nhập thành công
                        globalIp = ip;
                        globalPass = pass;
                        localStorage.setItem('esp_ip', ip);
                        localStorage.setItem('esp_pass', pass);

                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('main-app').style.display = 'block';
                        document.getElementById('errorMsg').style.display = 'none';
                    } else {
                        if(!isAuto) showError("❌ Sai mật khẩu hoặc IP không phản hồi đúng!");
                        logout();
                    }
                })
                .catch(err => {
                    if(!isAuto) showError("❌ Không thể kết nối tới IP: " + ip);
                    logout();
                });
        }

        function showError(msg) {
            let errBox = document.getElementById('errorMsg');
            errBox.innerText = msg;
            errBox.style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('esp_ip');
            localStorage.removeItem('esp_pass');
            globalIp = '';
            globalPass = '';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('main-app').style.display = 'none';
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if(tabName === 'control') document.getElementById('tab-control').classList.add('active');
            if(tabName === 'radar') document.getElementById('tab-radar').classList.add('active');
            if(tabName === 'wifi') document.getElementById('tab-wifi').classList.add('active');
            
            btnElement.classList.add('active');
        }

        function sendCmd(cmd) {
            fetch(`http://${globalIp}/${cmd}?pass=${globalPass}`)
                .then(res => res.ok ? alert("Lệnh đã thực thi!") : alert("Lỗi xác thực!"))
                .catch(err => alert("Mất kết nối ESP32!"));
        }

        function updateSensitivity() {
            let val = document.getElementById('radarSensVal').value;
            if(!val) { alert("Nhập giá trị hợp lệ!"); return; }

            fetch(`http://${globalIp}/set-sens?pass=${globalPass}&val=${val}`)
                .then(res => res.ok ? alert("Đã cập nhật độ nhạy!") : alert("Thất bại!"))
                .catch(err => alert("Lỗi kết nối!"));
        }

        function scanWiFi() {
            alert("Đang quét Wi-Fi, chờ khoảng 3 giây...");
            fetch(`http://${globalIp}/scan-wifi?pass=${globalPass}`)
                .then(res => res.text())
                .then(htmlOptions => {
                    document.getElementById('scanResultArea').innerHTML = `<label style="font-size:0.85rem;">Chọn Wi-Fi:</label><select id="selectedSsid">${htmlOptions}</select>`;
                })
                .catch(err => alert("Lỗi quét mạng!"));
        }

        function changeWiFi() {
            let ssidSelect = document.getElementById('selectedSsid');
            let ssid = ssidSelect ? ssidSelect.value : document.getElementById('manualSsid').value;
            let pass = document.getElementById('newWifiPass').value;

            if(!ssid) { alert("Chưa có tên Wi-Fi!"); return; }

            fetch(`http://${globalIp}/change-wifi?pass=${globalPass}&ssid=${encodeURIComponent(ssid)}&wpass=${encodeURIComponent(pass)}`)
                .then(res => res.text())
                .then(msg => alert(msg))
                .catch(err => alert("Lỗi kết nối!"));
        }

        // Cập nhật ngầm thông số từ ESP32
        setInterval(function() {
            if(!globalIp || !globalPass) return;

            fetch(`http://${globalIp}/data?pass=${globalPass}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('time').innerText = data.time;
                    document.getElementById('relay').innerText = data.relay ? 'BẬT 💡' : 'TẮT 🔌';
                    document.getElementById('radar_status').innerText = data.enabled ? (data.presence ? '🟢 CÓ NGƯỜI' : '🟢 TRỐNG') : '🔴 TẮT';
                    document.getElementById('mov_dist').innerText = data.mov > 0 ? data.mov + ' cm' : 'Không có';
                    document.getElementById('stat_dist').innerText = data.stat > 0 ? data.stat + ' cm' : 'Không có';
                    document.getElementById('current_sens').innerText = data.sens + ' cm';
                })
                .catch(err => {
                    document.getElementById('time').innerText = "Mất kết nối";
                });
        }, 1500);
    </script>
</body>
</html>
