<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMODA // NEON CONTROL SYSTEM</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --neon-yellow: #f39c12;
            --text-main: #e2e8f0;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, #1a1f35 0%, var(--bg-color) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 420px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 420px;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--border-glow);
            margin-bottom: 15px;
        }

        h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--neon-cyan);
            font-size: 0.9rem;
        }

        .status-item span {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .btn {
            border: none;
            color: #fff;
            padding: 12px;
            font-size: 0.95rem;
            margin: 6px 0;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            transition: all 0.2s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn:active { transform: scale(0.98); }
        .btn-on { background: linear-gradient(135deg, #00b09b, #96c93d); box-shadow: 0 0 10px rgba(0,255,102,0.3); }
        .btn-off { background: linear-gradient(135deg, #cb2d3e, #ef473a); box-shadow: 0 0 10px rgba(255,0,85,0.3); }
        .btn-pc { background: linear-gradient(135deg, #2193b0, #6dd5ed); box-shadow: 0 0 10px rgba(0,243,255,0.3); }
        .btn-scan { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
        .btn-save { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-warn { background: linear-gradient(135deg, #f12711, #f5af19); }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        .connection-box {
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .badge-live {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <h1>⚡ GAMODA NEON SYSTEM ⚡</h1>

    <!-- Khung cấu hình IP nội bộ và bảo mật -->
    <div class="connection-box tab-content active" id="config-panel" style="display:block; width:100%; max-width:420px;">
        <label><b>IP ESP32 LAN:</b></label>
        <input type="text" id="espIp" placeholder="Ví dụ: 192.168.1.50" onchange="saveConfig()">
        <label><b>Mật khẩu hệ thống (662):</b></label>
        <input type="password" id="espPass" value="662" onchange="saveConfig()">
    </div>

    <!-- Thanh chuyển Tab -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('control', this)">🎮 ĐIỀU KHIỂN</button>
        <button class="tab-btn" onclick="switchTab('radar', this)">📡 CẢM BIẾN</button>
        <button class="tab-btn" onclick="switchTab('wifi', this)">🌐 MẠNG WI-FI</button>
    </div>

    <!-- TAB 1: ĐIỀU KHIỂN THIẾT BỊ & PC -->
    <div class="tab-content active" id="tab-control">
        <div class="card">
            <h3>🖥️ TRẠNG THÁI HỆ THỐNG</h3>
            <div class="status-grid">
                <div class="status-item"><span>THỜI GIAN</span><b id="time">--:--</b></div>
                <div class="status-item"><span>RƠ-LE</span><b id="relay">--</b></div>
            </div>
            <button class="btn btn-on" onclick="sendCmd('on')">💡 BẬT THIẾT BỊ CHÍNH</button>
            <button class="btn btn-off" onclick="sendCmd('off')">🔌 TẮT THIẾT BỊ CHÍNH</button>
            <button class="btn btn-pc" onclick="sendCmd('onpc')">🖥️ BẬT NGUỒN PC</button>
            <button class="btn btn-warn" onclick="sendCmd('offpc')">⚠️ TẮT CƯỠNG BỨC PC</button>
        </div>
    </div>

    <!-- TAB 2: CẢM BIẾN RADAR & ĐỘ NHẠY -->
    <div class="tab-content" id="tab-radar">
        <div class="card">
            <h3>📡 CẢM BIẾN LD2410B</h3>
            <div class="status-grid">
                <div class="status-item"><span>TRẠNG THÁI</span><b id="radar_status">--</b></div>
                <div class="status-item"><span>ĐỘ NHẠY CÀI ĐẶT</span><b id="current_sens">-- cm</b></div>
            </div>
            <p>🏃 Di chuyển: <b id="mov_dist" style="color:var(--neon-cyan)">--</b></p>
            <p>🧍 Đứng yên: <b id="stat_dist" style="color:var(--neon-green)">--</b></p>

            <button class="btn btn-on" onclick="sendCmd('radar_on')">📡 BẬT CẢM BIẾN RADAR</button>
            <button class="btn btn-off" onclick="sendCmd('radar_off')">🔕 TẮT CẢM BIẾN RADAR</button>
            
            <label style="margin-top:10px; display:block; font-size:0.9rem;">Cấu hình khoảng cách tối đa:</label>
            <input type="number" id="radarSensVal" placeholder="Nhập từ 50 đến 1200 cm" min="50" max="1200">
            <button class="btn btn-pc" style="background:var(--neon-yellow); color:#000;" onclick="updateSensitivity()">⚙️ CẬP NHẬT ĐỘ NHẠY</button>
        </div>
    </div>

    <!-- TAB 3: CẤU HÌNH WI-FI KHẨN CẤP -->
    <div class="tab-content" id="tab-wifi">
        <div class="card">
            <h3>🌐 QUẢN LÝ KẾT NỐI MẠNG</h3>
            <button class="btn btn-scan" onclick="scanWiFi()">🔍 QUÉT MẠNG WI-FI XUNG QUANH</button>
            
            <div id="scanResultArea" style="margin: 10px 0;">
                <label>Tên Wi-Fi thủ công:</label>
                <input type="text" id="manualSsid" placeholder="Nhập SSID mạng nhà">
            </div>

            <label>Mật khẩu Wi-Fi:</label>
            <input type="password" id="newWifiPass" placeholder="Nhập mật khẩu Wi-Fi">
            
            <button class="btn btn-save" onclick="changeWiFi()">🔗 LƯU & KẾT NỐI LẠI</button>
        </div>
    </div>

    <script>
        // Tải cấu hình đã lưu
        document.getElementById('espIp').value = localStorage.getItem('esp_ip') || '';
        document.getElementById('espPass').value = localStorage.getItem('esp_pass') || '662';

        function saveConfig() {
            localStorage.setItem('esp_ip', document.getElementById('espIp').value.trim());
            localStorage.setItem('esp_pass', document.getElementById('espPass').value.trim());
        }

        function getBaseParams() {
            let ip = document.getElementById('espIp').value.trim();
            let pass = document.getElementById('espPass').value.trim();
            if(!ip) { alert("Vui lòng nhập chính xác IP của ESP32!"); return null; }
            return { ip, pass };
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if(tabName === 'control') document.getElementById('tab-control').classList.add('active');
            if(tabName === 'radar') document.getElementById('tab-radar').classList.add('active');
            if(tabName === 'wifi') document.getElementById('tab-wifi').classList.add('active');
            
            btnElement.classList.add('active');
        }

        function sendCmd(cmd) {
            let cfg = getBaseParams(); if(!cfg) return;
            fetch(`http://${cfg.ip}/${cmd}?pass=${cfg.pass}`)
                .then(res => res.ok ? alert("Lệnh đã thực thi thành công!") : alert("Lỗi mật khẩu hoặc kết nối!"))
                .catch(err => alert("Không thể kết nối đến ESP32 trong mạng LAN!"));
        }

        function updateSensitivity() {
            let cfg = getBaseParams(); if(!cfg) return;
            let val = document.getElementById('radarSensVal').value;
            if(!val) { alert("Vui lòng nhập khoảng cách hợp lệ!"); return; }

            fetch(`http://${cfg.ip}/set-sens?pass=${cfg.pass}&val=${val}`)
                .then(res => res.ok ? alert("Đã cập nhật độ nhạy radar!") : alert("Cập nhật thất bại!"))
                .catch(err => alert("Lỗi kết nối mạng!"));
        }

        function scanWiFi() {
            let cfg = getBaseParams(); if(!cfg) return;
            alert("Đang quét các điểm phát Wi-Fi, chờ khoảng 3 giây...");
            fetch(`http://${cfg.ip}/scan-wifi?pass=${cfg.pass}`)
                .then(res => res.text())
                .then(htmlOptions => {
                    document.getElementById('scanResultArea').innerHTML = `<label>Chọn Wi-Fi tìm thấy:</label><select id="selectedSsid">${htmlOptions}</select>`;
                })
                .catch(err => alert("Không thể quét mạng Wi-Fi!"));
        }

        function changeWiFi() {
            let cfg = getBaseParams(); if(!cfg) return;
            let ssidSelect = document.getElementById('selectedSsid');
            let ssid = ssidSelect ? ssidSelect.value : document.getElementById('manualSsid').value;
            let pass = document.getElementById('newWifiPass').value;

            if(!ssid) { alert("Chưa có thông tin tên mạng Wi-Fi!"); return; }

            fetch(`http://${cfg.ip}/change-wifi?pass=${cfg.pass}&ssid=${encodeURIComponent(ssid)}&wpass=${encodeURIComponent(pass)}`)
                .then(res => res.text())
                .then(msg => alert(msg))
                .catch(err => alert("Lỗi kết nối khi lưu Wi-Fi!"));
        }

        // Tự động làm mới dữ liệu thời gian thực ngầm từ ESP32
        setInterval(function() {
            let ip = document.getElementById('espIp').value.trim();
            let pass = document.getElementById('espPass').value.trim();
            if(!ip) return;

            fetch(`http://${ip}/data?pass=${pass}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('time').innerText = data.time;
                    document.getElementById('relay').innerText = data.relay ? 'BẬT 💡' : 'TẮT 🔌';
                    document.getElementById('radar_status').innerText = data.enabled ? (data.presence ? '🟢 CÓ NGƯỜI' : '🟢 TRỐNG') : '🔴 TẮT';
                    document.getElementById('mov_dist').innerText = data.mov > 0 ? data.mov + ' cm' : 'Không có';
                    document.getElementById('stat_dist').innerText = data.stat > 0 ? data.stat + ' cm' : 'Không có';
                    document.getElementById('current_sens').innerText = data.sens + ' cm';
                })
                .catch(err => {
                    document.getElementById('time').innerText = "Mất kết nối";
                });
        }, 1500);
    </script>
</body>
</html>
