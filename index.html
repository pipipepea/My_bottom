<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMODA // SIMPLE LAN CONTROL</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; box-sizing: border-box; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { text-align: center; color: #38bdf8; margin-top: 0; }
        .btn { border: none; color: white; padding: 14px; font-size: 15px; margin: 6px 0; cursor: pointer; border-radius: 8px; width: 100%; font-weight: bold; }
        .btn-on { background: #22c55e; } .btn-off { background: #ef4444; } .btn-pc { background: #3b82f6; }
        input[type=text], input[type=password] { width: 100%; padding: 10px; margin: 6px 0; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; text-align: center; font-size: 15px; }
        .box-config { background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .status-text { font-size: 16px; margin: 8px 0; }
    </style>
</head>
<body>

    <h2>⚡ GAMODA CONTROL ⚡</h2>

    <!-- Khung cấu hình IP và Mật khẩu LAN -->
    <div class="card box-config">
        <h3>⚙️ KẾT NỐI LAN ESP32</h3>
        <label>IP ESP32 (Ví dụ: 192.168.1.7):</label>
        <input type="text" id="espIp" placeholder="192.168.1.x" onchange="saveConfig()">
        <label>Mật khẩu hệ thống (662):</label>
        <input type="password" id="espPass" value="662" onchange="saveConfig()">
    </div>

    <!-- Khung điều khiển chính -->
    <div class="card">
        <h3>🖥️ TRẠNG THÁI & ĐIỀU KHIỂN</h3>
        <div class="status-text">⏰ Thời gian: <b id="time">Đang chờ...</b></div>
        <div class="status-text">🔌 Rơ-le: <b id="relay">--</b></div>
        <div class="status-text">📡 Radar: <b id="radar">--</b></div>
        <div class="status-text">🏃 Di chuyển: <b id="mov">--</b></div>

        <hr style="border:0; border-top:1px solid #475569; margin: 15px 0;">

        <button class="btn btn-on" onclick="sendCmd('on')">💡 BẬT THIẾT BỊ</button>
        <button class="btn btn-off" onclick="sendCmd('off')">🔌 TẮT THIẾT BỊ</button>
        <button class="btn btn-pc" onclick="sendCmd('onpc')">🖥️ BẬT NGUỒN PC</button>
        <button class="btn btn-off" style="background:#f97316;" onclick="sendCmd('offpc')">⚠️ TẮT CƯỠNG BỨC PC</button>
    </div>

    <script>
        // Tự động tải lại thông tin đã lưu trước đó
        document.getElementById('espIp').value = localStorage.getItem('esp_ip') || '';
        document.getElementById('espPass').value = localStorage.getItem('esp_pass') || '662';

        function saveConfig() {
            localStorage.setItem('esp_ip', document.getElementById('espIp').value.trim());
            localStorage.setItem('esp_pass', document.getElementById('espPass').value.trim());
        }

        function getBaseUrl() {
            let ip = document.getElementById('espIp').value.trim();
            return "http://" + ip;
        }

        function sendCmd(cmd) {
            let ip = document.getElementById('espIp').value.trim();
            let pass = document.getElementById('espPass').value.trim();
            if(!ip) { alert("Vui lòng nhập IP của ESP32!"); return; }

            fetch(`http://${ip}/${cmd}?pass=${pass}`)
                .then(res => {
                    if(res.ok) alert("Đã gửi lệnh thành công!");
                    else alert("Sai mật khẩu hoặc lỗi lệnh!");
                })
                .catch(err => alert("Không kết nối được tới ESP32 qua IP: " + ip));
        }

        // Vòng lặp gọi ngầm lấy thông số JSON từ ESP32 mỗi 2 giây
        setInterval(function() {
            let ip = document.getElementById('espIp').value.trim();
            let pass = document.getElementById('espPass').value.trim();
            if(!ip) return;

            fetch(`http://${ip}/data?pass=${pass}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('time').innerText = data.time;
                    document.getElementById('relay').innerText = data.relay ? "ĐANG BẬT 💡" : "ĐANG TẮT 🔌";
                    document.getElementById('radar').innerText = data.enabled ? (data.presence ? "🟢 CÓ NGƯỜI" : "🟢 TRỐNG") : "🔴 TẮT";
                    document.getElementById('mov').innerText = data.mov > 0 ? data.mov + " cm" : "Không có";
                })
                .catch(err => {
                    document.getElementById('time').innerText = "Mất kết nối LAN";
                });
        }, 2000);
    </script>
</body>
</html>
